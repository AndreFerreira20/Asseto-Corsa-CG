<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Carro Twingo - Babylon.js</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: monospace;
        color: #fff;
        text-shadow: 0 0 4px #000;
      }

      #hudMelhor {
        position: absolute;
        top: 16px;
        left: 20px;
        font-size: 22px;
      }

      #hudTempo {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 40px;
      }

    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
      <div id="hudMelhor">--:--.---</div>
      <div id="hudTempo">00:00.000</div>
    </div>

    <script src="./src/camera.js"></script>
    <script src="./src/car.js"></script>
    <script src="./src/pista/monza.js"></script>
    <script src="./src/pista/cenario.js"></script>
    <script src="./src/corrida/checkpoints.js"></script>
    <script src="./src/corrida/cronometro.js"></script>
    <script src="./src/scene.js"></script>

    <script>
      const canvas = document.getElementById("renderCanvas");
      const motor = new BABYLON.Engine(canvas, true);

      const cena = criarCena(motor, canvas);

      motor.runRenderLoop(() => cena.render());
      window.addEventListener("resize", () => motor.resize());
    </script>
  </body>
</html>
