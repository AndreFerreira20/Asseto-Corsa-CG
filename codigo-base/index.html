<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Carro Twingo - Babylon.js</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <script src="./src/camera.js"></script>
    <script src="./src/car.js"></script>
    <script src="./src/scene.js"></script>

    <script>
      const canvas = document.getElementById("renderCanvas");
      const motor = new BABYLON.Engine(canvas, true);

      const cena = criarCena(motor, canvas);

      motor.runRenderLoop(() => cena.render());
      window.addEventListener("resize", () => motor.resize());
    </script>
  </body>
</html>
